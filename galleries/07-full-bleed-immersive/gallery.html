<div class="gal-immersive-stage" data-gallery="full-bleed-immersive">
  <div class="gal-immersive-container">
    
    <!-- Minimalist Header -->
    <header class="gal-immersive-header">
      <div class="gal-immersive-branding">
        <span class="gal-immersive-kicker">CINEMATIC ARCHIVE // 21:9 PANORAMA</span>
        <h2 class="gal-immersive-title">Earth&rsquo;s Wild Frontiers</h2>
      </div>
      <div class="gal-immersive-playback-wrap">
        <button type="button" class="gal-immersive-play-btn" id="galImmersivePlayBtn" aria-label="Toggle panorama cycle">

          <svg class="gal-icon-pause" width="14" height="14" viewBox="0 0 24 24" fill="currentColor" style="display:none;"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>

    <div class="gal-immersive-viewport" id="galImmersiveViewport">

      <!-- Slide 1: Aurora Fjords -->
      <figure class="gal-immersive-slide is-active" data-index="0">
        <img 
          src="https://images.unsplash.com/photo-1517411032315-54ef2cb783bb?auto=format&fit=crop&w=1600&h=750&q=80" 
          alt="Ethereal emerald aurora borealis rippling across starry sky above icy Norwegian fjord waters"
          class="gal-immersive-img"
          loading="lazy"
          onerror="this.onerror=null; this.dataset.failed='true'; this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'1600\' height=\'750\' viewBox=\'0 0 1600 750\'><rect width=\'1600\' height=\'750\' fill=\'%23050a14\'/><text x=\'800\' y=\'375\' fill=\'%2338bdf8\' font-family=\'system-ui\' font-size=\'24\' text-anchor=\'middle\'>Frontier 01 &bull; Aurora Fjords (Tromsø)</text></svg>';"
        >
        <figcaption class="gal-immersive-caption">
          <span class="gal-immersive-geo">69.6492&deg; N, 18.9553&deg; E &bull; TROMS&Oslash;</span>
          <h3 class="gal-immersive-caption-heading">Aurora Over Kaldfjord</h3>
          <p class="gal-immersive-caption-text">Solar geomagnetism meeting upper atmospheric nitrogen above the Arctic sea shelf.</p>
        </figcaption>
      </figure>

      <!-- Slide 2: Mist Ridge -->

          src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=1600&h=750&q=80"
