<div class="auth-sso-stage" data-auth="social-sso">
  <div class="auth-sso-card">
    
    <header class="auth-sso-header">
      <div class="auth-sso-shield-icon" aria-hidden="true">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
      </div>
      <h2 class="auth-sso-title">Enterprise Single Sign-On</h2>
      <p class="auth-sso-subtitle">Select your organization&rsquo;s identity provider to authenticate with existing corporate credentials.</p>
    </header>

    <div class="auth-sso-alert" id="authSsoAlert" role="alert" aria-live="polite" hidden></div>

    <!-- SSO Primary Providers Grid -->
    <div class="auth-sso-providers" role="group" aria-label="Single Sign-On Providers">
      
      <!-- Google Workspace -->
      <button type="button" class="auth-sso-btn google" data-provider="Google Workspace">
        <svg class="auth-sso-btn-icon" width="18" height="18" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/>
          <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24z"/>
          <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.14-1.55.38-2.27V6.58H1.25C.45 8.18 0 10.03 0 12s.45 3.82 1.25 5.42l4.03-3.15z"/>
          <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
        </svg>
        <span>Continue with Google Workspace</span>
      </button>

      <!-- Microsoft Entra ID -->
      <button type="button" class="auth-sso-btn microsoft" data-provider="Microsoft Entra ID">
        <svg class="auth-sso-btn-icon" width="18" height="18" viewBox="0 0 24 24">
          <rect x="1" y="1" width="10" height="10" fill="#f25022"/>
          <rect x="13" y="1" width="10" height="10" fill="#7fba00"/>
          <rect x="1" y="13" width="10" height="10" fill="#00a4ef"/>
          <rect x="13" y="13" width="10" height="10" fill="#ffb900"/>
        </svg>
        <span>Continue with Microsoft Entra ID</span>
      </button>

      <!-- Okta / SAML -->
      <button type="button" class="auth-sso-btn okta" data-provider="Okta SSO">
        <svg class="auth-sso-btn-icon" width="18" height="18" viewBox="0 0 24 24" fill="#007dc1">
          <circle cx="12" cy="12" r="10" fill="none" stroke="#007dc1" stroke-width="4"/>
          <circle cx="12" cy="12" r="4" fill="#007dc1"/>
        </svg>
        <span>Single Sign-On with Okta (SAML 2.0)</span>
      </button>

      <!-- GitHub Enterprise -->
      <button type="button" class="auth-sso-btn github" data-provider="GitHub Enterprise">
        <svg class="auth-sso-btn-icon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/>
        </svg>
        <span>Continue with GitHub Enterprise</span>
      </button>

    </div>

    <!-- Divider -->
    <div class="auth-sso-divider">
      <span>or sign in with corporate email</span>
    </div>

    <!-- Fallback Form -->
    <form class="auth-sso-form" id="authSsoForm" novalidate>
      <div class="auth-sso-field">
        <label for="auth-sso-email" class="auth-sso-label">Corporate Email Address</label>
        <div class="auth-sso-input-row">
          <input 
            type="email" 
            id="auth-sso-email" 
            name="email"
            class="auth-sso-input" 
            placeholder="name@enterprise.domain"
            autocomplete="email"
            required
            aria-describedby="auth-sso-email-err"
          >
          <button type="submit" class="auth-sso-submit-inline" id="authSsoSubmit">
            <span>Send Magic Link</span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>
            </svg>
          </button>
        </div>
        <div class="auth-sso-error" id="auth-sso-email-err" role="alert" aria-live="polite"></div>
      </div>
    </form>

    <!-- Security Trust Footer -->
    <footer class="auth-sso-footer">
      <div class="auth-sso-trust-item">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <span>SOC 2 Type II Certified</span>
      </div>
      <span class="auth-sso-trust-bullet">&bull;</span>
      <div class="auth-sso-trust-item">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        <span>Enforced MFA / WebAuthn</span>
      </div>
    </footer>

  </div>
</div>
