<!-- centered brand -->
<header class="nb-centered-header" data-navbar="centered-brand">
  <div class="nb-centered-container">
    <!-- Left Navigation Links -->
    <nav class="nb-centered-nav-left" aria-label="Collections Navigation">
      <button type="button" class="nb-centered-hamburger" aria-expanded="false" aria-controls="nb-centered-mobile-menu" aria-label="Toggle navigation menu">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="12" x2="21" y2="12"/>
          <line x1="3" y1="6" x2="21" y2="6"/>
          <line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>
      <ul class="nb-centered-links">
        <li><a href="#collections" class="nb-centered-link active">Collections</a></li>
        <li><a href="#journal" class="nb-centered-link">Journal</a></li>
        <li><a href="#atelier" class="nb-centered-link">Atelier</a></li>
      </ul>
    </nav>

    <!-- Center Brand Logo -->
    <div class="nb-centered-brand-wrap">
      <a href="#" class="nb-centered-brand" aria-label="Maison Home">
        <span>MAISON</span><span class="nb-centered-degree">°</span>
      </a>
    </div>

    <!-- Right Utilities -->
    <div class="nb-centered-actions-right">
      <button type="button" class="nb-centered-icon-btn" aria-label="Search items">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
      </button>
      <a href="#account" class="nb-centered-icon-btn" aria-label="Customer account">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
      </a>
      <a href="#bag" class="nb-centered-btn-bag" aria-label="Shopping bag containing 0 items">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/>
          <line x1="3" y1="6" x2="21" y2="6"/>
          <path d="M16 10a4 4 0 0 1-8 0"/>
        </svg>
        <span>Bag</span>
        <span class="nb-centered-bag-count">0</span>
      </a>
    </div>
  </div>

  <!-- Mobile Dropdown Menu -->
  <div class="nb-centered-mobile-menu" id="nb-centered-mobile-menu" hidden>
    <div class="nb-centered-mobile-inner">
      <div class="nb-centered-mobile-search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input type="search" placeholder="Search collections..." aria-label="Search products" class="nb-centered-search-input">
      </div>
      <nav aria-label="Mobile Navigation">
        <ul class="nb-centered-mobile-links">
          <li><a href="#collections" class="nb-centered-mobile-link active">Collections</a></li>
          <li><a href="#journal" class="nb-centered-mobile-link">Journal</a></li>
          <li><a href="#atelier" class="nb-centered-mobile-link">Atelier</a></li>
          <li><a href="#account" class="nb-centered-mobile-link">My Account</a></li>
        </ul>
      </nav>
    </div>
  </div>
</header>
