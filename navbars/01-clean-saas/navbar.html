<!-- clean saas -->
<header class="nb-saas-header" data-navbar="clean-saas">
  <div class="nb-saas-container">
    <a href="#home" class="nb-saas-brand" aria-label="Orbit Home">
      <svg class="nb-saas-brand-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"/>
        <path d="M3.6 9h16.8"/>
        <path d="M3.6 15h16.8"/>
        <circle cx="12" cy="12" r="3" fill="#3157e5"/>
      </svg>
      <span>orbit</span><span class="nb-saas-dot">.</span>
    </a>

    <!-- Desktop Navigation Links -->
    <nav class="nb-saas-nav" aria-label="Primary Navigation">
      <ul class="nb-saas-links">
        <li><a href="#product" class="nb-saas-link active">Product</a></li>
        <!-- Dropdown Menu Item -->
        <li class="nb-saas-dropdown">
          <button type="button" class="nb-saas-link nb-saas-dropdown-btn" aria-expanded="false" aria-haspopup="true">
            <span>Solutions</span>
            <svg class="nb-saas-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 12 15 18 9"/>
            </svg>
          </button>
          <div class="nb-saas-dropdown-menu" hidden>
            <a href="#analytics" class="nb-saas-dropdown-item">
              <div class="nb-saas-dropdown-icon">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
              </div>
              <div>
                <div class="nb-saas-dropdown-title">Analytics</div>
                <div class="nb-saas-dropdown-desc">Real-time performance metrics</div>
              </div>
            </a>
            <a href="#automations" class="nb-saas-dropdown-item">
              <div class="nb-saas-dropdown-icon">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
              </div>
              <div>
                <div class="nb-saas-dropdown-title">Automations</div>
                <div class="nb-saas-dropdown-desc">No-code triggers and workflows</div>
              </div>
            </a>
            <a href="#enterprise" class="nb-saas-dropdown-item">
              <div class="nb-saas-dropdown-icon">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              </div>
              <div>
                <div class="nb-saas-dropdown-title">Enterprise Security</div>
                <div class="nb-saas-dropdown-desc">SOC2 compliance & SSO</div>
              </div>
            </a>
          </div>
        </li>
        <li><a href="#resources" class="nb-saas-link">Resources</a></li>
        <li><a href="#pricing" class="nb-saas-link">Pricing</a></li>
      </ul>
    </nav>

    <!-- Desktop Actions -->
    <div class="nb-saas-actions">
      <a href="#login" class="nb-saas-btn-text">Log in</a>
      <a href="#start" class="nb-saas-btn-primary">
        <span>Start free</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14M12 5l7 7-7 7"/>
        </svg>
      </a>
      <!-- Mobile Menu Toggle Button -->
      <button type="button" class="nb-saas-hamburger" aria-expanded="false" aria-controls="nb-saas-mobile-menu" aria-label="Toggle navigation menu">
        <span class="nb-saas-hamburger-line line-1"></span>
        <span class="nb-saas-hamburger-line line-2"></span>
        <span class="nb-saas-hamburger-line line-3"></span>
      </button>
    </div>
  </div>

  <!-- Mobile Dropdown Menu -->
  <div class="nb-saas-mobile-menu" id="nb-saas-mobile-menu" hidden>
    <div class="nb-saas-mobile-inner">
      <nav aria-label="Mobile Navigation">
        <ul class="nb-saas-mobile-links">
          <li><a href="#product" class="nb-saas-mobile-link active">Product</a></li>
          <li><a href="#solutions" class="nb-saas-mobile-link">Solutions</a></li>
          <li><a href="#resources" class="nb-saas-mobile-link">Resources</a></li>
          <li><a href="#pricing" class="nb-saas-mobile-link">Pricing</a></li>
        </ul>
      </nav>
      <div class="nb-saas-mobile-actions">
        <a href="#login" class="nb-saas-mobile-login">Log in</a>
        <a href="#start" class="nb-saas-btn-primary nb-saas-btn-block">Start free</a>
      </div>
    </div>
  </div>
</header>
